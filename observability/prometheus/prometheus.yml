# Prometheus Configuration for URL Shortener Service

global:
  scrape_interval: 15s # Default scrape interval
  scrape_timeout: 10s
  evaluation_interval: 15s # Evaluate rules every 15 seconds

  external_labels:
    cluster: 'url-shortener-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # URL Shortener Application
  - job_name: 'url-shortener-app'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']
        labels:
          service: 'url-shortener'
          component: 'api'
    metric_relabel_configs:
      # Drop high-cardinality labels for cost optimization
      - source_labels: [__name__]
        regex: 'url_clicks_total'
        action: drop
        # Consider aggregating instead if needed

  # PostgreSQL Database
  - job_name: 'postgresql'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          component: 'database'

  # Redis Cache
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'infrastructure'
          component: 'host'

  # Nginx Reverse Proxy
  - job_name: 'nginx'
    scrape_interval: 30s
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          component: 'reverse-proxy'

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # Loki (Log Aggregation)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
          component: 'logging'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'

# Remote write for long-term storage (optional - for production scale)
# remote_write:
#   - url: "https://prometheus-remote-storage.example.com/api/v1/write"
#     basic_auth:
#       username: "prometheus"
#       password: "${REMOTE_STORAGE_PASSWORD}"
#     queue_config:
#       capacity: 10000
#       max_shards: 10
#       min_shards: 1
#       max_samples_per_send: 5000

# Storage configuration
storage:
  tsdb:
    retention:
      time: 30d # Keep metrics for 30 days
      size: 10GB # Maximum storage size
    wal_compression: true
