<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator</title>
<meta name="description" content="All my links">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://trunc.site/m/sasha">
<meta property="og:type" content="profile">
<meta property="og:title" content="Creator">
<meta property="og:description" content="All my links">
<meta property="og:url" content="https://trunc.site/m/sasha">
<meta property="og:image" content="https://cdn.example.com/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Creator">
<meta name="twitter:description" content="All my links">
<meta name="twitter:image" content="https://cdn.example.com/og.jpg">

<base target="_blank">
<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--text);background-color:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
.bg-image{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.bg-overlay{position:fixed;inset:0;background:#000;opacity:var(--overlay);z-index:-1}
.page{max-width:480px;margin:0 auto;padding:32px 16px 24px}
.card{background:var(--card);border-radius:var(--card-radius);box-shadow:var(--shadow);padding:28px 20px;display:flex;flex-direction:column;gap:18px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* profile header */
.profile{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;border:var(--avatar-border) solid var(--accent);background:var(--soft)}
.avatar-fallback{display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:var(--accent)}
.profile h1{margin:8px 0 0;font-size:24px;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.verified{color:var(--accent);width:20px;height:20px}
.pronouns{font-size:13px;color:var(--muted)}
.role{margin:0;font-size:15px;color:var(--muted)}
.company-logo{height:28px;width:auto;margin-top:4px}
.location{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.location .icon{width:16px;height:16px}
.bio{margin:4px 0 0;white-space:pre-line}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:12px 18px;border-radius:var(--radius);text-decoration:none;font-weight:600;font-size:16px;text-align:center;border:2px solid var(--accent);background:var(--soft);color:var(--text);transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.circle:focus-visible,.contact:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn img.thumb{width:36px;height:36px;border-radius:calc(var(--radius) / 2);object-fit:cover;margin-left:-6px}
.links{display:flex;flex-direction:column;gap:12px}

/* contact buttons */
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:12px}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-size:13px;color:var(--muted)}
.contact span.ico{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-text)}

/* social icons */
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.circle{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--soft);border:2px solid var(--accent);color:var(--text);text-decoration:none;font-weight:700;font-size:14px}
.circle .icon{width:20px;height:20px}

/* text, image, divider */
.text{margin:0;white-space:pre-line}
.text.center{text-align:center}
.image{margin:0}
.image img{width:100%;border-radius:var(--radius)}
.divider{border:0;border-top:1px solid var(--line);margin:4px 0}
.spacer{height:12px}

/* badge */
.badge{text-align:center;margin-top:20px}
.badge a{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--card);color:var(--text);font-size:12px;text-decoration:none;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted)}
:root{--bg:#134e5e;--card:#f8faf5;--accent:#166534;--accent-text:#ffffff;--text:#14251b;--muted:#5d6961;--soft:#e1ebe2;--line:#d6dad4;--font:Georgia, Cambria, "Times New Roman", Times, serif;--radius:999px;--card-radius:32px;--shadow:0 20px 50px rgba(0,0,0,.30);--avatar-border:6px;--overlay:0}body{background-image:radial-gradient(circle at 50% 0%, #134e5e, #71b280);background-attachment:fixed}</style>
</head>
<body>

<main class="page">
<div class="card">


<header class="profile">
  <img class="avatar" src="https://cdn.example.com/a.jpg" alt="Ari" width="104" height="104">
  <h1>Ari</h1>
  
  
  
  
  <p class="bio">Creator</p>
</header>













<nav class="links" aria-label="Links">
<a class="btn btn-primary" href="https://youtube.com/@x" data-track="click" data-block="blk_links" data-item="l1" target="_blank" rel="noopener noreferrer"><img class="thumb" src="https://cdn.example.com/t.jpg" alt="" width="36" height="36">Latest</a>
<a class="btn" href="mailto:a@example.com" data-track="click" data-block="blk_links" data-item="l2">Mail me</a>
</nav>











<p class="text center">Hello &lt;there&gt; &amp; welcome</p>









<figure class="image"><a href="https://example.com" data-track="click" data-block="blk_img" target="_blank" rel="noopener noreferrer"><img src="https://cdn.example.com/i.jpg" alt="Photo" loading="lazy"></a></figure>









<div class="spacer" aria-hidden="true"></div>








<hr class="divider">

</div>
<footer class="badge"><a href="https://trunc.site/?ref=m" rel="noopener">Made with Trunc</a></footer>
</main>

</body>
</html>
