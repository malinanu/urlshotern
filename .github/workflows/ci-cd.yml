name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # gosec SARIF upload

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: urlshortener_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache Node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: |
        go mod download
        cd frontend && npm ci

    - name: Run Go tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: test
        DB_PASSWORD: test
        DB_NAME: urlshortener_test
        DB_SSLMODE: disable
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-secret
      run: |
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html

    # Report-only: coverage is far below a useful gate today (~7%). Turn this back
    # into a threshold once the test suite has grown.
    - name: Report Go coverage
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        echo "Go statement coverage: ${COVERAGE}"
        echo "### Go coverage: ${COVERAGE}" >> "$GITHUB_STEP_SUMMARY"

    # The frontend has no test runner yet; this becomes active once a "test" script exists
    - name: Run Frontend tests
      run: |
        cd frontend
        npm run test --if-present -- --coverage --watchAll=false

    - name: Check Frontend coverage threshold
      run: |
        cd frontend
        # Extract coverage percentage from coverage-summary.json
        if [ -f coverage/coverage-summary.json ]; then
          COVERAGE=$(node -pe "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct")
          THRESHOLD=70
          echo "Current frontend coverage: ${COVERAGE}%"
          echo "Required threshold: ${THRESHOLD}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Frontend coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Frontend coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
        else
          echo "⚠️  No coverage report found, skipping frontend coverage check"
        fi

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.out,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

    - name: Security scan with Gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt sarif -out gosec.sarif ./... || true
        [ -f gosec.sarif ] || echo '{"version":"2.1.0","runs":[]}' > gosec.sarif

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: gosec.sarif
      # Only when the gosec step produced a report (it doesn't run if tests fail)
      if: always() && hashFiles('gosec.sarif') != ''

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # lint-changed.mjs diffs against the base commit

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Existing code has a lint backlog (gosec, noctx); only issues introduced by
    # the change being tested fail the build.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8
        args: --timeout=5m
        only-new-issues: true

    - name: Type-check frontend
      run: |
        cd frontend
        npm ci
        npx tsc --noEmit

    # Same idea for ESLint: fail only on errors on lines this change adds or modifies
    - name: Lint changed frontend lines
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        cd frontend
        node scripts/lint-changed.mjs "$BASE_SHA"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Ensure trivy-results.sarif exists
      run: |
        [ -f trivy-results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
        mkdir -p static
        cp -r out/* static/

    - name: Build Go application
      run: |
        CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o main ./cmd/server

  # Portainer builds the image from source (docker-compose.oracle.yml), so no registry image is pushed here
  deploy:
    name: Deploy via Portainer
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Trigger Portainer stack redeploy
      continue-on-error: true
      run: |
        if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
          echo "⚠️ PORTAINER_WEBHOOK_URL is not set. Skipping automated redeploy."
          exit 0
        fi
        echo "Triggering Portainer webhook..."
        if curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"; then
          echo "✅ Portainer redeploy webhook triggered successfully."
        else
          echo "⚠️ Warning: Failed to reach Portainer webhook URL."
          echo "ℹ️ Please verify PORTAINER_WEBHOOK_URL in repository secrets (ensure hostname has public DNS or use server IP)."
        fi
