name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run Gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt sarif -out gosec-results.sarif ./... || true
        [ -f gosec-results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > gosec-results.sarif

    - name: Upload Gosec SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: gosec-results.sarif
      if: always()

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go, javascript
        queries: security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./... || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Run npm audit
      run: |
        cd frontend
        npm ci
        npm audit --audit-level high || true

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --only-verified
      continue-on-error: true

  filesystem-scan:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs.sarif'
      continue-on-error: true

    - name: Ensure trivy-fs.sarif exists
      run: |
        [ -f trivy-fs.sarif ] || echo '{"version":"2.1.0","runs":[]}' > trivy-fs.sarif

    - name: Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-fs.sarif
      if: always()

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, secrets-scan, filesystem-scan]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Generate Security Summary
      run: |
        echo "# Security Scan Summary" >> security-report.md
        echo "Generated on: $(date)" >> security-report.md
        echo "" >> security-report.md
        echo "## Scan Results" >> security-report.md
        echo "- SAST (Gosec + CodeQL): ${{ needs.sast.result }}" >> security-report.md
        echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
        echo "- Secrets Detection: ${{ needs.secrets-scan.result }}" >> security-report.md
        echo "- Filesystem Scan: ${{ needs.filesystem-scan.result }}" >> security-report.md

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
