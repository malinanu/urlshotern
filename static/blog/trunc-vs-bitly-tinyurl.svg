<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="120" cy="560" r="160" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Category badge -->
  <rect x="80" y="140" width="110" height="28" rx="14" fill="#ffffff" fill-opacity="0.15"/>
  <text x="135" y="159" font-family="sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">COMPARISON</text>

  <!-- Main heading -->
  <text x="80" y="240" font-family="sans-serif" font-size="48" font-weight="800" fill="#ffffff">Trunc vs Bitly</text>
  <text x="80" y="298" font-family="sans-serif" font-size="48" font-weight="800" fill="#ffffff">vs TinyURL</text>
  <text x="80" y="356" font-family="sans-serif" font-size="32" font-weight="600" fill="#93c5fd">Which URL Shortener Wins in 2026?</text>

  <!-- Comparison cards -->
  <rect x="80" y="400" width="200" height="80" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#60a5fa" stroke-width="2"/>
  <text x="180" y="436" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Trunc</text>
  <text x="180" y="460" font-family="sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle">AI · Analytics · Free</text>

  <rect x="310" y="400" width="200" height="80" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="410" y="436" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Bitly</text>
  <text x="410" y="460" font-family="sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle">Integrations · Pricey</text>

  <rect x="540" y="400" width="200" height="80" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="640" y="436" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">TinyURL</text>
  <text x="640" y="460" font-family="sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle">Simple · No analytics</text>

  <!-- Branding -->
  <text x="80" y="570" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">trunc.site</text>
  <text x="1120" y="570" font-family="sans-serif" font-size="14" fill="#93c5fd" text-anchor="end">Free URL Shortener</text>
</svg>
