version: '3.8'

# Redis Cluster for local development
# This simulates a production Redis cluster with 3 masters and 3 slaves

services:
  # Redis Master Nodes
  redis-node-1:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - redis-node-1-data:/data
    networks:
      - urlshortener

  redis-node-2:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6380
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6380:6380"
      - "16380:16380"
    volumes:
      - redis-node-2-data:/data
    networks:
      - urlshortener

  redis-node-3:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6381
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6381:6381"
      - "16381:16381"
    volumes:
      - redis-node-3-data:/data
    networks:
      - urlshortener

  # Redis Replica Nodes
  redis-node-4:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6382
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6382:6382"
      - "16382:16382"
    volumes:
      - redis-node-4-data:/data
    networks:
      - urlshortener

  redis-node-5:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6383
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6383:6383"
      - "16383:16383"
    volumes:
      - redis-node-5-data:/data
    networks:
      - urlshortener

  redis-node-6:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6384
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6384:6384"
      - "16384:16384"
    volumes:
      - redis-node-6-data:/data
    networks:
      - urlshortener

  # Redis Cluster Setup (runs once to create cluster)
  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: >
      sh -c "sleep 10 &&
      redis-cli --cluster create
      redis-node-1:6379
      redis-node-2:6380
      redis-node-3:6381
      redis-node-4:6382
      redis-node-5:6383
      redis-node-6:6384
      --cluster-replicas 1
      --cluster-yes"
    networks:
      - urlshortener

  # Redis Commander for cluster management
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=node1:redis-node-1:6379,node2:redis-node-2:6380,node3:redis-node-3:6381
    ports:
      - "8082:8081"
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    networks:
      - urlshortener

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:

networks:
  urlshortener:
    driver: bridge
