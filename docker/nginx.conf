events {
    worker_connections 1024;
}

http {
    # Hide nginx version from responses
    server_tokens off;

    # Cloudflare real IP resolution.
    # Instructs nginx to replace $remote_addr with CF-Connecting-IP
    # so rate limiting and logging use the real client IP, not Cloudflare's proxy IP.
    real_ip_header     CF-Connecting-IP;
    real_ip_recursive  on;
    set_real_ip_from   103.21.244.0/22;
    set_real_ip_from   103.22.200.0/22;
    set_real_ip_from   103.31.4.0/22;
    set_real_ip_from   104.16.0.0/13;
    set_real_ip_from   104.24.0.0/14;
    set_real_ip_from   108.162.192.0/18;
    set_real_ip_from   131.0.72.0/22;
    set_real_ip_from   141.101.64.0/18;
    set_real_ip_from   162.158.0.0/15;
    set_real_ip_from   172.64.0.0/13;
    set_real_ip_from   173.245.48.0/20;
    set_real_ip_from   188.114.96.0/20;
    set_real_ip_from   190.93.240.0/20;
    set_real_ip_from   197.234.240.0/22;
    set_real_ip_from   198.41.128.0/17;
    set_real_ip_from   2400:cb00::/32;
    set_real_ip_from   2606:4700::/32;
    set_real_ip_from   2803:f800::/32;
    set_real_ip_from   2405:b500::/32;
    set_real_ip_from   2405:8100::/32;
    set_real_ip_from   2a06:98c0::/29;
    set_real_ip_from   2c0f:f248::/32;

    upstream url_shortener {
        server app:8080;
    }

    # Extract access_token cookie value for use in auth_request Authorization header.
    # The Go backend only accepts Bearer tokens — not cookies — so we lift the
    # cookie value into the header before forwarding the auth check request.
    map $http_cookie $auth_token_from_cookie {
        default                          "";
        ~*(?:^|;\s*)access_token=([^;]+) $1;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=redirect:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP to HTTPS in production
        # (leave as-is for local Docker; production TLS is terminated upstream)

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content Security Policy
        # 'unsafe-inline' for scripts is required by static Next.js exports (no nonce support).
        # This still blocks scripts loaded from unlisted origins.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://t.contentsquare.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://t.contentsquare.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Internal auth check — validates the access_token cookie by calling the
        # backend profile endpoint with it promoted to a Bearer token.
        # Returns 200 → allow, 401/403 → redirect to login.
        location = /_auth_check {
            internal;
            proxy_pass http://url_shortener/api/v1/user/profile;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Promote cookie to Authorization header so the Go JWT middleware accepts it
            proxy_set_header Authorization "Bearer $auth_token_from_cookie";
        }

        # Admin route — server-side auth guard via auth_request.
        # Logged-in users (cookie present) pass through; everyone else → /login.
        location /admin {
            auth_request /_auth_check;
            error_page 401 403 = @admin_unauthorized;
            limit_req zone=redirect burst=20 nodelay;
            proxy_pass http://url_shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @admin_unauthorized {
            return 302 /login?redirect=/admin;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://url_shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://url_shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Short URL redirects with rate limiting
        location / {
            limit_req zone=redirect burst=50 nodelay;
            proxy_pass http://url_shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server configuration (uncomment and configure for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Security headers
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #     add_header X-Frame-Options DENY;
    #     add_header X-Content-Type-Options nosniff;
    #     add_header X-XSS-Protection "1; mode=block";
    #
    #     # Same location blocks as HTTP server
    #     location /api/ {
    #         limit_req zone=api burst=20 nodelay;
    #         proxy_pass http://url_shortener;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /health {
    #         proxy_pass http://url_shortener;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         limit_req zone=redirect burst=50 nodelay;
    #         proxy_pass http://url_shortener;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}