# Enhanced Nginx Configuration for CDN Integration
# Optimized for CloudFlare CDN with proper caching headers

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom MIME types for modern formats
    types {
        application/wasm wasm;
        image/avif avif;
        image/webp webp;
        font/woff2 woff2;
    }

    # Logging format with CDN-specific headers
    log_format cdn '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time" '
                   'cf_ray="$http_cf_ray" cf_country="$http_cf_ipcountry" '
                   'cf_cache="$http_cf_cache_status" cdn_hit="$upstream_cache_status"';

    access_log /var/log/nginx/access.log cdn;
    error_log /var/log/nginx/error.log warn;

    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10M;

    # Gzip Compression (fallback for non-Brotli clients)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # Brotli Compression (better compression ratio)
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream backend
    upstream app {
        server app:8080;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=redirect:10m rate=1000r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # Real IP detection (CloudFlare)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Cache path for proxy caching
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=url_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Map to determine cacheable content
    map $request_method $skip_cache {
        default 1;
        GET 0;
        HEAD 0;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name trunc.site www.trunc.site;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/trunc.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trunc.site/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers (CloudFlare will add more at edge)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection limits
        limit_conn perip 20;
        limit_conn perserver 2000;

        # Static assets with long cache
        location ~* ^/_next/static/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Long cache for immutable assets
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;

            # Tell CDN to cache aggressively
            add_header CDN-Cache-Control "public, max-age=31536000, immutable";

            # Proxy caching at origin (behind CDN)
            proxy_cache url_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
        }

        # JavaScript and CSS bundles
        location ~* \.(js|css)$ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 7d;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
            add_header CDN-Cache-Control "public, max-age=604800";
            add_header Vary "Accept-Encoding";

            # Enable Gzip/Brotli
            gzip_static on;
            brotli_static on;
        }

        # Images and media
        location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|eot)$ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header CDN-Cache-Control "public, max-age=2592000";
            add_header Vary "Accept";

            # Proxy caching
            proxy_cache url_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
        }

        # API: URL Shortening (no cache)
        location /api/v1/shorten {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            # No caching for POST requests
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        # API: Analytics (short cache)
        location /api/v1/analytics/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Short cache for analytics data
            expires 5m;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
            add_header CDN-Cache-Control "public, max-age=300";

            # Proxy cache
            proxy_cache url_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $skip_cache;
        }

        # API: Other endpoints
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            # Short cache for GET requests
            expires 1m;
            add_header Cache-Control "public, max-age=60";
        }

        # Short URL redirects (critical performance path)
        location ~ "^/[a-zA-Z0-9]{4,10}$" {
            limit_req zone=redirect burst=100 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Referer $http_referer;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            # Cache redirects for 1 hour
            expires 1h;
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
            add_header CDN-Cache-Control "public, max-age=3600";

            # Proxy caching
            proxy_cache url_cache;
            proxy_cache_valid 301 302 1h;
            proxy_cache_key "$scheme$request_method$host$uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Fast timeouts for redirects
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://app;
            proxy_http_version 1.1;
            access_log off;

            add_header Cache-Control "no-cache";
            expires -1;

            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        # HTML pages (dynamic content)
        location / {
            limit_req zone=general burst=100 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Short cache with background revalidation
            expires 5m;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
            add_header CDN-Cache-Control "public, max-age=300";

            # HTTP/2 Server Push for critical assets
            http2_push_preload on;
        }

        # Block common exploit attempts
        location ~* /(wp-admin|wp-login|administrator|phpMyAdmin|phpmyadmin) {
            deny all;
            return 404;
        }

        # Block sensitive file extensions
        location ~* \.(env|log|ini|conf|bak|sql|sh|git)$ {
            deny all;
            return 404;
        }

        # Favicon
        location = /favicon.ico {
            proxy_pass http://app;
            expires 1M;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Robots.txt
        location = /robots.txt {
            proxy_pass http://app;
            expires 1d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Cache status endpoint (for monitoring)
        location /nginx-cache-status {
            default_type text/plain;
            return 200 "Nginx cache status: OK\n";
            access_log off;
        }
    }

    # Cache purge endpoint (restrict to internal network)
    server {
        listen 127.0.0.1:8082;
        server_name localhost;

        location /purge/ {
            allow 127.0.0.1;
            deny all;

            proxy_cache_purge url_cache "$scheme$request_method$host$uri";
        }
    }
}
