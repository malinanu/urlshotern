services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=urlshortener
      # SECURITY: For local development only. Use strong password in production.
      - DB_PASSWORD=${DB_PASSWORD:-devpassword}
      - DB_NAME=urlshortener_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8080
      # SECURITY: For local development only. Use actual credentials in production.
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-polar_oat_bmzD64gals01kuZuN6dCdEloAIlj43F00klYr1x7Pdr}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-whsec_test_mock_secret_for_development}
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID:-65dca2de-3a3e-4a9a-9464-ee6053485626}
      - POLAR_API_URL=${POLAR_API_URL:-https://sandbox-api.polar.sh/v1}
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
      - /app/tmp
      - /app/frontend/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - urlshortener

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urlshortener_db
      POSTGRES_USER: urlshortener
      # SECURITY: For local development only. Use strong password in production.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../configs/database.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../configs/auth_schema.sql:/docker-entrypoint-initdb.d/02-auth-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urlshortener

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - urlshortener

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - urlshortener

volumes:
  postgres_data:
  redis_data:

networks:
  urlshortener:
    driver: bridge