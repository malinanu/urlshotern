services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend.dev
    container_name: urlshortener-backend-dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=urlshort_app
      # SECURITY: For local development only. Use strong password in production.
      - DB_PASSWORD=${DB_PASSWORD:-app_dev_password}
      - DB_NAME=urlshortener_db
      # Multi-user database configuration
      - DB_APP_NAME=urlshortener_db
      - DB_APP_USER=urlshort_app
      - DB_APP_PASSWORD=app_dev_password
      - DB_ADMIN_NAME=urlshortener_db
      - DB_ADMIN_USER=urlshort_admin
      - DB_ADMIN_PASSWORD=admin_dev_password
      - DB_READONLY_NAME=urlshortener_db
      - DB_READONLY_USER=urlshort_readonly
      - DB_READONLY_PASSWORD=readonly_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8080
      # SECURITY: For local development only. Use actual credentials in production.
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-polar_oat_FznrcyEMfYnc6ke3JJQDsM1na1fP4LSPheBNB3tNNxr}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-whsec_test_mock_secret_for_development}
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID:-65dca2de-3a3e-4a9a-9464-ee6053485626}
      - POLAR_API_URL=${POLAR_API_URL:-https://sandbox-api.polar.sh/v1}
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
      - /app/tmp
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urlshortener

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend.dev
    container_name: urlshortener-frontend-dev
    environment:
      # Use localhost:8080 for browser requests (port is exposed to host)
      # BACKEND_URL is used for server-side Next.js rewrites (uses Docker network)
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - BACKEND_URL=http://backend:8080
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Enable WebSocket support for HMR
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - urlshortener

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urlshortener_db
      POSTGRES_USER: urlshortener
      # SECURITY: For local development only. Use strong password in production.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../configs/database.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../configs/auth_schema.sql:/docker-entrypoint-initdb.d/02-auth-schema.sql
      - ../migrations/002_setup_database_users.sql:/docker-entrypoint-initdb.d/03-setup-users.sql
      - ./init-scripts/04-create-admin-user.sql:/docker-entrypoint-initdb.d/04-create-admin-user.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urlshortener

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - urlshortener

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - urlshortener

volumes:
  postgres_data:
  redis_data:

networks:
  urlshortener:
    driver: bridge