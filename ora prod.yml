version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: urlshortener-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgresql-central     # Centralized PostgreSQL
      - DB_PORT=5432
      - DB_USER=urlshortener_user
      - DB_PASSWORD=682wR74d28y5U3mAw2K923UXo
      - DB_NAME=urlshortener_db
      - DB_MAX_CONNECTIONS=25
      - DB_MAX_IDLE_CONNECTIONS=10
      - DB_CONN_MAX_LIFETIME=3600
      - DB_CONN_MAX_IDLE_TIME=600
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ID=1
      - BASE_URL=https://trunc.site  # Update with your domain
      - ENVIRONMENT=production
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
    depends_on:
      - redis
    networks:
      - shared-db-network          # Connect to shared database network
      - urlshortener-network       # Internal network for Redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    ports:
      - "127.0.0.1:6380:6379"      # Changed port to avoid conflicts
    volumes:
      - redis-data:/data
    networks:
      - urlshortener-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: urlshortener-adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgresql-central
    networks:
      - shared-db-network
    restart: unless-stopped

networks:
  shared-db-network:
    external: true                 # Use external centralized network
  urlshortener-network:
    driver: bridge

volumes:
  redis-data: