linters:
  disable-all: true
  enable:
    - govet
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec
    - bodyclose
    - noctx

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
